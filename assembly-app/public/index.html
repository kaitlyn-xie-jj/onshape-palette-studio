<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Assembly Palette Studio — Preview</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">ONSHAPE PALETTE STUDIO / ASSEMBLY M1</p><h1>跨来源装配体配色计划</h1><p>读取 Assembly → 按来源零件分组 → 选择色系 → 预览并导出。当前为 <strong>只读测试版</strong>，不会更改模型。</p></header>
    <form id="palette-form">
      <label>Onshape Assembly URL<input type="url" id="url" placeholder="https://cad.onshape.com/documents/.../w/.../e/..." autocomplete="off"></label>
      <div class="controls"><label>配色主题<select id="theme"></select></label><label>排列方式<select id="arrangement"><option value="GRADIENT">Gradient</option><option value="ALTERNATE">Alternate</option><option value="SPREAD">Spread</option><option value="REVERSE">Reverse</option></select></label><label>变化<select id="variation"></select></label></div>
      <div class="buttons"><button type="button" id="demo">示例装配体预览</button><button type="submit" id="load">读取真实 Onshape Assembly</button><a class="secondary" id="login" href="/auth/start">连接 Onshape（只读）</a><button type="button" id="logout">退出连接</button></div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="results" hidden><div class="summary"><h2>配色方案</h2><span id="counts"></span></div><div id="swatches"></div><div class="buttons"><button type="button" id="json">导出 JSON</button><button type="button" id="csv">导出 CSV</button><button type="button" id="apply" disabled title="未验证 Onshape 外观写入接口">Apply to Assembly（未开放）</button></div><h2>警告与限制</h2><ul id="warnings"></ul><h2>已跳过的实例</h2><ul id="skipped"></ul></section>
    <footer>原生 FeatureScript 仍可在来源 Part Studio 中使用。此页面不调用任何 CAD 写入接口，也不支持实例单独上色。</footer>
  </main>
</body>
</html>
