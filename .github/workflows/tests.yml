name: Offline palette checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Verify generated assets are reproducible
        run: |
          python build.py
          git diff --exit-code -- src/palette_studio.fs preview/palette-preview.html preview/palette-gallery.svg
